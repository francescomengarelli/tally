[package]
name = "tally"
version = "0.2.3"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
toml = "1.1.2"
toml_edit = "0.25.17"

[profile.release]
strip = true        # strips debug symbols — biggest win
opt-level = "z"    # optimize for size instead of speed
lto = true         # link-time optimization, removes dead code
codegen-units = 1  # slower compile, better optimization
panic = "abort"    # removes unwinding machinery

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
